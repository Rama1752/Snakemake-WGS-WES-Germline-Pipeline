# =====================================================================
#  Germline WGS/WES pipeline configuration
#  FASTQ -> QC -> trim -> BWA -> markdup -> [BQSR] -> call -> filter
# =====================================================================

samples: "config/samples.tsv"

# ---- Reference (must be pre-indexed) ----
reference:
  fasta:     "/path/to/genome.fa"   # needs .fai (samtools faidx) + .dict (gatk CreateSequenceDictionary)
  bwa_index: "/path/to/genome.fa"   # bwa index prefix (usually same as fasta)

# ---- Mode switch: WGS vs WES ----
mode: "wes"                # wes | wgs
#   wes -> HaplotypeCaller/BQSR restricted to capture.targets (+padding); mosdepth on-target
#   wgs -> no interval restriction; mosdepth genome-wide

capture:                   # used only when mode: wes
  targets: "/path/to/targets.interval_list"
  bed:     "/path/to/targets.bed"
  padding: 100

bqsr:
  run: true
  known_sites:
    - "/path/to/dbsnp.vcf.gz"
    - "/path/to/Mills_and_1000G_gold_standard.indels.hg38.vcf.gz"
    - "/path/to/known_indels.vcf.gz"

filters:
  run: true
  # SNP hard-filter thresholds (GATK best practice)
  qd_snp: 2.0
  fs_snp: 60.0
  sor_snp: 3.0
  mq_snp: 40.0
  mqranksum_snp: -12.5
  readposranksum_snp: -8.0
  # INDEL hard-filter thresholds
  qd_indel: 2.0
  fs_indel: 200.0
  sor_indel: 10.0

# ---- Scratch dir (Java/GATK temp; keep off small /tmp) ----
tmpdir: "tmp"

# ---- Java heap for GATK tools ----
java_mem: "16G"

# ---- Per-tool threads (edit any independently) ----
threads:
  fastqc: 4
  fastp: 16
  bwa: 32
  sort: 8
  markdup: 4
  bqsr: 4
  haplotypecaller: 16
  genotypegvcfs: 4
  mosdepth: 4

# ---- Memory caps (MB) for high-memory rules; used with --resources mem_mb=<total> ----
mem_mb:
  bwa: 12000
  markdup: 16000
  haplotypecaller: 20000
